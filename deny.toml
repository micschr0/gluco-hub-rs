# gluco-hub supply-chain policy.
# CLAUDE.md mandates `cargo deny check` for every new dep — this file
# encodes the policy so the gate is reproducible across machines and CI.

[graph]
# Lint every feature combination, not just the default-features build.
all-features = true
targets = []

[advisories]
version = 2
yanked = "deny"
# Reviewed 2026-11-07 against the locked graph and upstream source.
# Evidence, feature matrix and removal criteria: docs/security/tls-advisories.md.
# Keep individual advisory IDs; do not suppress a whole advisory category.
# rumqttc 0.25.1 directly depends on WebPKI 0.102.8 ONLY for tls::Error::WebPki.
# Actual TLS verification uses tokio-rustls 0.26.6 / rustls 0.23.46 /
# WebPKI 0.103.16. The bans rule below prevents an old verifier via another parent.
# Reassess on every rumqttc/TLS upgrade; no broker-pinning assumption is made.
ignore = [
    # Active PEM parsing reads operator-supplied mTLS certificates and keys.
    # This is maintenance debt, not an unreachable-input claim. Direct migration
    # is tracked in #127; rumqttc also retains the parser transitively.
    { id = "RUSTSEC-2025-0134", reason = "rustls-pemfile 2.2.0 delegates to maintained rustls-pki-types; operator mTLS PEM is parsed; temporary maintenance exception pending #127 and rumqttc cleanup" },
    { id = "RUSTSEC-2026-0049", reason = "WebPKI 0.102.8 is only rumqttc 0.25.1's error type; CRL verification uses no code from it; active rustls uses patched 0.103.16" },
    { id = "RUSTSEC-2026-0098", reason = "WebPKI 0.102.8 is only rumqttc 0.25.1's error type; URI name constraints are processed by patched 0.103.16, not waived based on DNS-only usage" },
    { id = "RUSTSEC-2026-0099", reason = "WebPKI 0.102.8 is only rumqttc 0.25.1's error type; active certificate verification uses patched 0.103.16, not broker pinning" },
    { id = "RUSTSEC-2026-0104", reason = "WebPKI 0.102.8 is only rumqttc 0.25.1's error type; no CRL parser from it is called; active rustls uses patched 0.103.16" },
    { id = "RUSTSEC-2026-0382", reason = "WebPKI 0.102.8 is only rumqttc 0.25.1's error type; actual TLS verification uses 0.103.16 with the distrusted-intermediate fix" },
    # Separate dev-only maintenance exceptions, not vulnerability waivers.
    # Reassess when testcontainers/compose dependencies change; never accept
    # untrusted archives or compose files on the strength of these exceptions.
    { id = "RUSTSEC-2026-0440", reason = "astral-tokio-tar 0.6.4 is testcontainers 0.27.3 archive support, dev/test only; no patched release; temporary exception pending upstream replacement" },
    { id = "RUSTSEC-2024-0449", reason = "unsafe-libyaml 0.2.11 via serde_yaml/docker-compose-types/testcontainers parses the repository's Nightscout test fixture, dev/test only; no patched release; pending upstream replacement" },
]

[licenses]
version = 2
# Conservative permissive set. Anything outside this list fails the
# `licenses` check; an exception requires editing this file with a
# comment + reviewer sign-off.
allow = [
    # Workspace own license — gluco-hub-rs is AGPL-3.0-or-later.
    "AGPL-3.0-or-later",
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CC0-1.0",
    # Used by `webpki-roots`, which ships Mozilla's CA trust list. The
    # data itself is CDLA-Permissive-2.0; the Rust crate code is
    # MIT/Apache-2.0. Mozilla considers this permissive-equivalent.
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.93

[bans]
multiple-versions = "warn"
wildcards = "deny"
# Workspace path-deps (`{ path = "../foo" }`) have no version and look
# like wildcards to cargo-deny — but they're internal, not pulled from
# crates.io. This flag allows them while still rejecting external
# wildcards.
allow-wildcard-paths = true
# Per CLAUDE.md: rustls only, no OpenSSL anywhere in the tree.
# Adding any of these to a Cargo.toml fails this check loudly.
deny = [
    # Advisory ignores are global IDs in cargo-deny 0.20.2. Restrict vulnerable
    # stable WebPKI versions to rumqttc's reviewed error-type dependency so a
    # downgrade of rustls's active verifier still fails `cargo deny check`.
    { name = "rustls-webpki", version = "<0.103.16", wrappers = ["rumqttc"], reason = "only rumqttc's unused WebPki error variant may retain the old crate; active TLS verification must be patched" },
    { name = "openssl" },
    { name = "openssl-sys" },
    { name = "native-tls" },
    { name = "git2" },
]

[sources]
unknown-registry = "deny"
unknown-git = "deny"
